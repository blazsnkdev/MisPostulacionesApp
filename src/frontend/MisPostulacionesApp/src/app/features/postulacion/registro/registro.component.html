    <div class="container">

    <form [formGroup]="formIA">
        <mat-card class="section-card">
        <mat-card-content>

            <mat-form-field appearance="outline" class="full-width">
            <mat-label>Texto de la oferta</mat-label>
            <textarea
                matInput
                rows="6"
                placeholder="Pega aquí el texto completo de la oferta de trabajo..."
                formControlName="textoIA">
            </textarea>
            </mat-form-field>

            <button
            mat-raised-button
            color="primary"
            type="button"
            (click)="procesarIA()"
            [disabled]="procesando">
            Procesar IA
            </button>

        </mat-card-content>
        </mat-card>
    </form>

    <!-- ================= SEPARADOR ================= -->
    <div class="separator">
        <mat-divider>
        <span class="separator-text">
            <mat-icon>arrow_downward</mat-icon>
            Información extraída
            <mat-icon>arrow_downward</mat-icon>
        </span>
        </mat-divider>
    </div>

    <!-- ================= GUARDAR POSTULACIÓN ================= -->
    <form [formGroup]="form">
        <mat-card class="section-card">

        <mat-card-header>
            <div mat-card-avatar>
            <mat-icon class="avatar-icon">work</mat-icon>
            </div>
            <mat-card-title>Registrar Postulación</mat-card-title>
            <mat-card-subtitle>
            Revisa y completa la información extraída por la IA
            </mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>

            <!-- Título, Empresa, Rol -->
            <div class="form-row">
            <mat-form-field appearance="outline" class="form-field">
                <mat-label>Título*</mat-label>
                <input matInput formControlName="titulo">
            </mat-form-field>

            <mat-form-field appearance="outline" class="form-field">
                <mat-label>Empresa*</mat-label>
                <input matInput formControlName="empresa">
            </mat-form-field>

            <mat-form-field appearance="outline" class="form-field">
                <mat-label>Rol*</mat-label>
                <input matInput formControlName="rol">
            </mat-form-field>
            </div>

            <!-- Descripción -->
            <mat-form-field appearance="outline" class="full-width">
            <mat-label>Descripción</mat-label>
            <textarea matInput rows="4" formControlName="descripcion"></textarea>
            </mat-form-field>

            <!-- Tecnologías -->
            <mat-form-field appearance="outline" class="full-width">
            <mat-label>Tecnologías</mat-label>
            <textarea matInput rows="3" formControlName="tecnologias"></textarea>
            </mat-form-field>

            <!-- Salario / Modalidad / Plataforma -->
            <div class="form-row">
            <mat-form-field appearance="outline" class="form-field">
                <mat-label>Salario</mat-label>
                <input matInput type="number" formControlName="salario">
            </mat-form-field>

            <mat-form-field appearance="outline" class="form-field">
                <mat-label>Modalidad</mat-label>
                <mat-select formControlName="modalidad">
                <mat-option value="Presencial">Presencial</mat-option>
                <mat-option value="Remoto">Remoto</mat-option>
                <mat-option value="Híbrido">Híbrido</mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline" class="form-field">
                <mat-label>Plataforma</mat-label>
                <input matInput formControlName="plataforma">
            </mat-form-field>
            </div>

            <!-- Notas -->
            <mat-form-field appearance="outline" class="full-width">
            <mat-label>Notas</mat-label>
            <textarea matInput rows="3" formControlName="notas"></textarea>
            </mat-form-field>

            <!-- Botones -->
            <div class="form-actions">
            <button
                mat-raised-button
                color="primary"
                type="button"
                (click)="guardarPostulacion()"
                [disabled]="form.invalid || guardando">
                Guardar
            </button>

            <button
                mat-stroked-button
                type="button"
                (click)="limpiarFormulario()"
                color="warn">
                Limpiar
            </button>
            </div>

        </mat-card-content>
        </mat-card>
    </form>

    </div>
